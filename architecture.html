<header>
  <h1>Home Quest — Architecture (live)</h1>

<script type="module">
// Load libs from a CDN, with a fallback CDN, so a single CDN hiccup doesn't blank the page.
let mermaid, svgPanZoom;
const CDNS = [
  ['https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs', 'https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/+esm'],
  ['https://esm.sh/mermaid@10', 'https://esm.sh/svg-pan-zoom@3.6.1'],
];
for (const [mUrl, pUrl] of CDNS) {
  try {
    mermaid = (await import(mUrl)).default;
    svgPanZoom = (await import(pUrl)).default;
    break;
  } catch (e) { /* try the next CDN */ }
}
if (!mermaid || !svgPanZoom) {
  document.getElementById('diagram').innerHTML =
    '<pre style="color:#f38ba8;padding:24px;white-space:pre-wrap;font-size:14px;line-height:1.6;">' +
    'Could not load the diagram libraries.\n\n' +
    'This page needs an internet connection the first time — it pulls Mermaid and\n' +
    'svg-pan-zoom from a CDN. Check your connection (or a VPN/firewall that may be\n' +
    'blocking cdn.jsdelivr.net and esm.sh), then reload.</pre>';
  throw new Error('Diagram libraries failed to load from all CDNs.');
}

  Store: { t: 'Zustand Store (central hub)', f: 'src/store/index.ts + slices/ + selectors/ + persistence/',
    html: `
    <div class="row"><div class="k">The simple idea</div><div class="v">

      <br><br>Nobody in the app passes notes to each other. If a part wants to change something,

    <div class="row"><div class="k">What's written on it</div><div class="v">

      • <code>uiSlice.ts</code> — which tool you picked, which panels are open<br>
      • <code>viewerSlice.ts</code> — 3D camera settings<br>
      • <code>vastuSlice.ts</code> — the Vastu score<br>
      • <code>settingsSlice.ts</code> — app options<br>

    </div></div>

    <div class="row"><div class="k">Writing on the board (making a change)</div><div class="v">

      4. <code>addWall</code> writes the new wall onto the board
         <span style="color:#6c7086">(src/store/slices/editorSlice.ts)</span><br><br>

      <code>moveVertex</code> <span style="color:#6c7086">(editorSlice.ts)</span>,

        <span style="color:#6c7086">(src/domains/editor/hooks/useRoomDetection.ts)</span>

        <span style="color:#6c7086">(services/roomDetection.ts)</span> → writes <code>rooms</code> back.<br>

        <span style="color:#6c7086">(services/scoring.ts)</span> → writes <code>vastuScore</code> back.<br><br>

      <span style="color:#6c7086">(src/store/selectors/editorSelectors.ts)</span>:<br>

    <div class="row"><div class="k">Saving your work</div><div class="v">

  Gate: { t: 'useAppStore() — the gate', f: 'created in src/store/index.ts (the store IS this function)',
    html: `
    <div class="row"><div class="k">The simple idea</div><div class="v">
      <code>useAppStore</code> is the <b>one door</b> to the Store. Nothing reads or changes the
      Store without going through it. It's not a helper next to the store — it <b>is</b> the store,
      handed to you as a function by Zustand's <code>create()</code>.<br><br>
      Think of it as the <b>security gate</b> of a building: everything that goes in (changes) and
      everything that comes out (data) passes through this single gate.
    </div></div>

    <div class="row"><div class="k">Coming OUT — reading</div><div class="v">
      A component asks the gate for just the piece it needs:<br>
      <code>const walls = useAppStore(s ⇒ s.walls)</code><br>
      This also <b>subscribes</b>: if <code>walls</code> changes, that component re-runs on its own.
      Read once without subscribing: <code>useAppStore.getState().walls</code>.
    </div></div>

    <div class="row"><div class="k">Going IN — writing</div><div class="v">
      To change something you call an <b>action</b> through the gate:<br>
      <code>useAppStore.getState().addWall(start, end)</code><br>
      The action runs <code>set()</code>, which goes through <b>Immer</b> to make the safe new copy,
      and the updated state lands in the Store.
    </div></div>

    <div class="row"><div class="k">Why a single gate</div><div class="v">
      Because everything funnels through one door, the whole app shares <b>one source of truth</b> —
      no part keeps its own private copy that could drift out of sync. Change it once, everyone sees it.
    </div></div>

    <div class="row"><div class="k">In one line</div><div class="v">
      Read: <code>useAppStore(s ⇒ s.piece)</code> · Write: <code>useAppStore.getState().action()</code>.

    </div></div>` },

  Immer: { t: 'Immer (makes the safe copy)', f: 'zustand/middleware/immer · wired in src/store/index.ts',
    html: `
    <div class="row"><div class="k">The simple idea</div><div class="v">
      Immer is a small helper library (not a server, not an API — just code). Its job:
      let you <b>change</b> the store by writing plain edits, while it quietly makes the
      correct <b>copy</b> behind the scenes.<br><br>
      Think of it as a <b>photocopier with a pen</b>: you scribble your change on the page,
      and it hands back a fresh copy with your change applied — the original is never
      damaged.
    </div></div>

    <div class="row"><div class="k">The problem it fixes</div><div class="v">
      React/Zustand rule: you may not edit state in place, you must make a new copy.
      By hand that's painful for nested data:<br>
      <code>state = { ...state, walls: { ...state.walls, [id]: { ...state.walls[id], thickness: 20 } } }</code>
    </div></div>

    <div class="row"><div class="k">How you write it now</div><div class="v">
      With Immer it's one direct line:<br>
      <code>set(s ⇒ { s.walls[id].thickness = 20 })</code><br>
      Looks like a mutation, but Immer records it on a temporary <b>draft</b> and returns a
      brand-new immutable state. You can change several fields in the same block.
    </div></div>

    <div class="row"><div class="k">Where it lives in this app</div><div class="v">
      Wired once in <code>src/store/index.ts</code>:
      <code>create()( devtools( persist( immer( ...slices ) ) ) )</code>.<br>
      Because it wraps the slices, <b>every action in every slice</b>
      (<code>editorSlice.ts</code>, <code>vastuSlice.ts</code>, ...) uses it automatically.
    </div></div>

    <div class="row"><div class="k">Its place in the flow</div><div class="v">
      It sits just behind the gate, on the <b>write</b> side. When an action's <code>set()</code>
      runs, Immer produces the new immutable state and hands it to <code>persist</code> +
      <code>devtools</code>, then subscribers are notified. So the order is:
      <code>useAppStore action → set() → Immer → Store</code>.
    </div></div>

    <div class="row"><div class="k">In one line</div><div class="v">
      You write a simple edit → Immer turns it into a safe new copy → the Store updates.
    </div></div>` },

  HooksConcept: { t: 'Hooks (use… functions)', f: 'React feature · used all over src/domains/**/hooks/ and src/store/selectors/',
    html: `
    <div class="row"><div class="k">The simple idea</div><div class="v">
      A hook is just a <b>reusable function whose name starts with</b> <code>use</code>.
      It lets a component borrow React powers — remembering things, and reacting when data
      changes — without copy-pasting that logic into every component.<br><br>
      Think of hooks as <b>plug-in tools</b>: a component plugs in <code>useWallDrawing</code>
      to get drawing behavior, or <code>useRoomDetection</code> to get auto room-finding.
      A hook ≠ a drawing tool — drawing tools are just <i>one kind</i> of hook.
    </div></div>

    <div class="row"><div class="k">The one rule</div><div class="v">
      Its name must start with <code>use</code> (so React knows to manage it), and it's
      called at the top of a component or another hook — never inside an if/loop.
    </div></div>

    <div class="row"><div class="k">The kinds of hooks in THIS app</div><div class="v">
      <b>1. Tool hooks</b> — turn your clicks into store actions.<br>
      <span style="color:#6c7086">src/domains/editor/hooks/</span>
      <code>useWallDrawing</code>, <code>useStairTool</code>, <code>useArrayTool</code>, <code>useRoadDrawing</code><br><br>
      <b>2. Reactive hooks</b> — watch the store and recompute automatically.<br>
      <span style="color:#6c7086">editor/hooks/, vastu/hooks/</span>
      <code>useRoomDetection</code> → <code>detectRooms()</code>,
      <code>useVastuAnalysis</code> → <code>computeVastuScore()</code><br><br>
      <b>3. Selector hooks</b> — read just the slice a component needs.<br>
      <span style="color:#6c7086">src/store/selectors/editorSelectors.ts</span>
      <code>useWallSegments</code>, <code>useEndpoints</code>, <code>useViewerWalls</code><br><br>
      <b>4. Input / asset hooks</b> — camera + model loading.<br>
      <span style="color:#6c7086">viewer/hooks/</span>
      <code>useFirstPerson</code>, <code>useOrbitCamera</code>, <code>useAssetLoader</code>
    </div></div>

    <div class="row"><div class="k">Example — a tool hook at work</div><div class="v">
      1. <code>EditorCanvas</code> calls <code>useWallDrawing()</code> and gets back <code>handleClick</code>.<br>
      2. On your 2nd click → <code>handleClick()</code> runs <code>store.addWall()</code>.<br>
      So the hook is the bridge: <b>click → store action</b>.
    </div></div>

    <div class="row"><div class="k">Reusable in action — one hook, many callers</div><div class="v">
      Say you write a hook once that tracks the mouse position:<br>
      <code>function useMousePos() { const [p,setP]=useState({x:0,y:0}); useEffect(()=>{...},[]); return p; }</code><br><br>
      Now <b>any</b> component can plug it in with a single line, and each gets its own working copy —
      no code duplicated:<br>
      <code>const p = useMousePos();</code> &nbsp;← in the Toolbar<br>
      <code>const p = useMousePos();</code> &nbsp;← in the Canvas<br>
      <code>const p = useMousePos();</code> &nbsp;← in a Minimap<br><br>
      <b>Real example in this app:</b> <code>useWallSegments()</code>
      <span style="color:#6c7086">(src/store/selectors/editorSelectors.ts)</span> packages "walls ready to draw"
      once. The 2D <code>WallLayer</code> calls it to draw walls; a dimensions overlay could call the
      <i>same</i> hook to measure them — same logic, zero copy-paste. Fix a bug in the hook and every
      caller is fixed at once.
    </div></div>

    <div class="row"><div class="k">Why hooks exist</div><div class="v">
      To <b>reuse logic</b> and keep components clean. The drawing math lives once in
      <code>useWallDrawing</code>; any component can plug it in instead of rewriting it.

  IDB: { t: 'IndexedDB — auto-save', f: 'src/store/persistence/persistConfig.ts · wired in src/store/index.ts',
    html: `
    <div class="row"><div class="k">The simple idea</div><div class="v">
      IndexedDB is a small <b>database built into your browser</b> — it lives on your own
      computer, not on a server. Home Quest saves your plan here <b>automatically</b> so that
      when you refresh or reopen the page, your work is still there.<br><br>
      Think of it as the browser's own <b>filing cabinet</b>: the app quietly drops a copy of
      your plan in it every time something changes.
    </div></div>

    <div class="row"><div class="k">How saving happens</div><div class="v">
      The <code>persist</code> setup in <code>src/store/index.ts</code> watches the Store.
      Every change, it writes the plan to IndexedDB through
      <code>indexedDBStorage.setItem()</code>
      <span style="color:#6c7086">(persistence/persistConfig.ts, built on the idb-keyval <code>set()</code> helper)</span>.

      floors...), skipping temporary stuff like the selected tool and undo history.
    </div></div>

    <div class="row"><div class="k">How loading happens</div><div class="v">

      <code>indexedDBStorage.getItem()</code> <span style="color:#6c7086">(idb-keyval <code>get()</code>)</span>.
      If the save is from an older version, <code>migrate()</code> → <code>migrateState()</code>
      <span style="color:#6c7086">(persistence/migrations.ts)</span> upgrades it to today's format first,
      then it's put back into the Store.
    </div></div>

    <div class="row"><div class="k">Good to know</div><div class="v">
      It's per-browser and per-device — the plan saved in Chrome on this machine won't appear in
      another browser or computer (there's no server syncing them). To move a plan, use
      <b>file export</b> (the other Persistence box).
    </div></div>

    <div class="row"><div class="k">In one line</div><div class="v">
      Store changes → <code>persist</code> auto-writes the plan to IndexedDB; on reload it reads
      it back (upgrading old saves) so nothing is lost.
    </div></div>` },

  FileIO: { t: 'File / Image export', f: 'src/store/persistence/fileIO.ts · imageExport.ts',
    html: `
    <div class="row"><div class="k">The simple idea</div><div class="v">

      <span style="color:#6c7086">(imageExport.ts)</span>. Each can output

      Manual out/in: <code>exportFloorPlan()</code> downloads a file, <code>importFloorPlan()</code>

window.info = (id) => {
  const d = INFO[id];
  if (!d) return;
  const body = d.html
    ? d.html
    : `<div class="row"><div class="k">What it does</div><div class="v">${d.does}</div></div>
       <div class="row"><div class="k">Triggered by</div><div class="v">${d.trig}</div></div>
       <div class="row"><div class="k">Calls / next</div><div class="v">${d.calls}</div></div>`;
  document.getElementById('panel').innerHTML = `<h2>${d.t}</h2><div class="file">${d.f}</div>${body}`;
};

mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'loose' });

const el = document.getElementById('diagram');
let svg;
try {
  ({ svg } = await mermaid.render('graphDiv', graph));
} catch (err) {
  el.innerHTML = '<pre style="color:#f38ba8;padding:20px;white-space:pre-wrap;font-size:13px;">' +
    'Diagram failed to render:\n\n' + (err && err.message ? err.message : err) + '</pre>';
  throw err;
}
el.innerHTML = svg;
const svgEl = el.querySelector('svg');
svgEl.style.maxWidth = 'none';
svgEl.style.width = '100%';
svgEl.style.height = '100%';

// Robust click handling: delegate on the container (capture phase) and match the clicked
// node to an INFO key. Works no matter how Mermaid formats node ids, and survives
// svg-pan-zoom reparenting / event capture.
const INFO_KEYS = Object.keys(INFO).sort((a, b) => b.length - a.length); // longest first
function keyForNode(g) {
  if (!g || !g.id) return null;
  return INFO_KEYS.find((k) => new RegExp('(^|-)' + k + '(-|$)').test(g.id)) || null;
}
el.addEventListener('click', (ev) => {
  const g = ev.target.closest ? ev.target.closest('.node') : null;
  if (!g) return;
  if (/(^|-)Zoom(-|$)/.test(g.id)) { window.open('store-detail.html', '_blank'); return; }
  if (/(^|-)Frontend(-|$)/.test(g.id)) { window.open('frontend-detail.html', '_blank'); return; }
  const key = keyForNode(g);
  if (key) window.info(key);
}, true);

const pz = svgPanZoom(svgEl, {
  zoomEnabled: true, controlIconsEnabled: false, fit: true, center: true,
  minZoom: 0.2, maxZoom: 20, zoomScaleSensitivity: 0.3,
  dblClickZoomEnabled: false,
});

document.getElementById('zin').onclick = () => pz.zoomIn();
document.getElementById('zout').onclick = () => pz.zoomOut();
document.getElementById('zreset').onclick = () => { pz.resetZoom(); pz.center(); pz.fit(); };

// ----- resizable panel (drag the divider left/right) -----
const panel = document.getElementById('panel');
const resizer = document.getElementById('resizer');
const controls = document.getElementById('controls');
const MIN_W = 280;

function setPanelWidth(px) {
  const max = window.innerWidth - 200;
  const w = Math.max(MIN_W, Math.min(px, max));
  panel.style.width = w + 'px';
  pz.resize(); pz.fit(); pz.center();
}
setPanelWidth(340);

let dragging = false;
resizer.addEventListener('mousedown', (e) => {
  dragging = true; resizer.classList.add('dragging');
  document.body.style.userSelect = 'none'; e.preventDefault();
});
window.addEventListener('mousemove', (e) => {
  if (dragging) setPanelWidth(window.innerWidth - e.clientX);
});
window.addEventListener('mouseup', () => {
  dragging = false; resizer.classList.remove('dragging'); document.body.style.userSelect = '';
});
// double-click divider: toggle wide / normal
let wide = false;
resizer.addEventListener('dblclick', () => {
  wide = !wide;
  setPanelWidth(wide ? Math.round(window.innerWidth * 0.6) : 340);
});
window.addEventListener('resize', () => { pz.resize(); pz.fit(); pz.center(); });
</script>
